name: App Store · Preflight / Submit

# Manual, API-only operations against App Store Connect:
#   preflight   — READ-ONLY audit of the real submission state (changes nothing)
#   hold-review — cancels the active review submission without changing a build
#   prepare-version — creates the exact project version and release notes
#   select-build — attaches the exact expected build without submitting
#   submit      — submits the exact expected version/build for App Store review
#   swap-latest — swaps the exact expected processed build and resubmits
#                 (cancels the in-progress submission first if one exists)
# Runs on Linux: pure ASC API calls, no Xcode, no Simulator, 1x runner cost.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Audit, prepare version, select exact build, submit, hold, or set release mode"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - hold-review
          - prepare-version
          - select-build
          - submit
          - swap-latest
          - auto-release
      expected_version:
        description: "Exact marketing version (must match project.yml for release actions)"
        required: true
        default: "1.2"
        type: string
      expected_build:
        description: "Exact build to audit/select/submit/release; never implicit latest"
        required: true
        default: "48"
        type: string
      release_source_sha:
        description: "Exact code commit M used by the binary/screenshots (required for select/submit/swap/auto-release)"
        required: false
        default: ""
        type: string

concurrency:
  group: app-store-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Submit/swap must verify the exact screenshot release commit. The
          # read-only preflight remains unchanged by the full-history checkout.
          fetch-depth: 0

      - name: Ruby + Fastlane (cached)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Validate release guards before App Store access
        run: ruby fastlane/spec/lore_release_tooling_test.rb

      - name: Run ${{ inputs.action }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP_REVIEW_HOLD: ${{ vars.APP_REVIEW_HOLD }}
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          ACTION: ${{ inputs.action }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_BUILD: ${{ inputs.expected_build }}
        run: |
          case "$ACTION" in
            hold-review)  bundle exec fastlane hold_review expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            prepare-version) bundle exec fastlane prepare_version expected_version:"$EXPECTED_VERSION" ;;
            select-build) bundle exec fastlane select_release_build expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            submit)       bundle exec fastlane submit_for_review expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            swap-latest)  bundle exec fastlane swap_latest_build_and_resubmit expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            auto-release) bundle exec fastlane set_auto_release expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            preflight)    bundle exec fastlane preflight expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            *)            printf "%s\n" "Unknown action: $ACTION" >&2; exit 2 ;;
          esac
