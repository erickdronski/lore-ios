name: App Store · Preflight / Submit

# Manual, API-only operations against App Store Connect:
#   preflight   — READ-ONLY audit of the real submission state (changes nothing)
#   hold-review — cancels the active review submission without changing a build
#   submit      — submits the editable version for App Store review
#   swap-latest — swaps the newest processed build onto the version and resubmits
#                 (cancels the in-progress submission first if one exists)
# Runs on Linux: pure ASC API calls, no Xcode, no Simulator, 1x runner cost.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Audit, hold review, submit, swap the build, or change release mode"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - hold-review
          - submit
          - swap-latest
          - auto-release
      expected_version:
        description: "Version to hold (guarded exact match)"
        required: true
        default: "1.1"
        type: string
      expected_build:
        description: "Attached build to hold (guarded exact match)"
        required: true
        default: "7"
        type: string
      release_source_sha:
        description: "Exact 40-character source SHA for submit/swap screenshot provenance (unused by preflight/hold)"
        required: false
        default: ""
        type: string

concurrency:
  group: app-store-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Submit/swap must verify the exact screenshot release commit. The
          # read-only preflight remains unchanged by the full-history checkout.
          fetch-depth: 0

      - name: Ruby + Fastlane (cached)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run ${{ inputs.action }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APP_REVIEW_HOLD: ${{ vars.APP_REVIEW_HOLD }}
          RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          ACTION: ${{ inputs.action }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_BUILD: ${{ inputs.expected_build }}
        run: |
          case "$ACTION" in
            hold-review)  bundle exec fastlane hold_review expected_version:"$EXPECTED_VERSION" expected_build:"$EXPECTED_BUILD" ;;
            submit)       bundle exec fastlane submit_for_review ;;
            swap-latest)  bundle exec fastlane swap_latest_build_and_resubmit ;;
            auto-release) bundle exec fastlane set_auto_release ;;
            *)            bundle exec fastlane preflight ;;
          esac
