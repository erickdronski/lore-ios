name: App Store · Preflight / Submit

# Manual, API-only operations against App Store Connect:
#   preflight   — READ-ONLY audit of the real submission state (changes nothing)
#   submit      — submits the editable version for App Store review
#   swap-latest — swaps the newest processed build onto the version and resubmits
#                 (cancels the in-progress submission first if one exists)
# Runs on Linux: pure ASC API calls, no Xcode, no Simulator, 1x runner cost.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "preflight (audit), submit, or swap-latest (new build + resubmit)"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - submit
          - swap-latest

concurrency:
  group: app-store-preflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    environment: app-store-production
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ruby + Fastlane (cached)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Run ${{ inputs.action }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          case "${{ inputs.action }}" in
            submit)      bundle exec fastlane submit_for_review ;;
            swap-latest) bundle exec fastlane swap_latest_build_and_resubmit ;;
            *)           bundle exec fastlane preflight ;;
          esac
